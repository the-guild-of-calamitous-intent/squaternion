[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "squaternion"
version = "2026.11.10"
description = "Some simple functions for quaternion math"
authors = [{ name="walchko", email="walchko@users.noreply.github.com" }]
readme = "readme.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['rotations', 'quaternion', 'euler']
classifiers = [
    # 'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    # 'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
]

# dependencies = [
#     "colorama"
# ]

# [project.optional-dependencies]
# pdf = ["ReportLab>=1.2", "RXP"]
# rest = ["docutils>=0.3", "pack ==1.1, ==1.3"]

# [project.scripts]
# my-script = "my_package.module:function"

[project.urls]
Homepage = "https://pypi.org/project/squaternion/"
Repository = 'https://github.com/the-guild-of-calamitous-intent/squaternion'

[tool.setuptools.packages.find]
where = ["."]
include = ["squaternion*"]

[tool.marimo.runtime]
pythonpath = ["."]